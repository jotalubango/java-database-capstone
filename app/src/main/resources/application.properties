# ---------------------------------------------------------------------------------------------------
# Initialize schema and data
# ---------------------------------------------------------------------------------------------------
#        --- use only to initialize data --- spring.datasource.schema=classpath:schema.sql
#        --- use only to initialize data --- spring.datasource.data=classpath:data.sql
#        --- use only to initialize data --- spring.sql.init.mode=always
#        --- use only to initialize data --- spring.jpa.defer-datasource-initialization=true

spring.datasource.schema=classpath:schema.sql
spring.datasource.data=classpath:data.sql
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
